# Load the shopping_items.json file into a sensor's attributes.
# Put the JSON catalog at /config/shopping_items.json, not this YAML file.
# Merge this mapping into configuration.yaml; if command_line already exists,
# append the sensor entry to that list. Expose each JSON category below.
# The short timestamp is only the sensor state; products live in attributes.

command_line:
  - sensor:
      name: "Shopping List Items"
      command: "cat /config/shopping_items.json"
      value_template: "{{ now().timestamp() }}"
      json_attributes:
        - Fruits
        - Vegetables
        - Frozen
        - "Dairy and Eggs"
        - Meat
        - "Condiments, Herbs & Spices"
        - Grains
        - Snacks
      scan_interval: 300
