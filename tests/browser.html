<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping List Card Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <style>
    :root {
      font-family: sans-serif;
      color: #212121;
      background: #f1f3f5;
      --primary-text-color: #212121;
      --secondary-text-color: #656970;
      --primary-color: #0288d1;
      --card-background-color: #ffffff;
      --ha-card-background: #ffffff;
      --ha-card-border-radius: 8px;
      --ha-card-box-shadow: 0 1px 3px #0002;
      --secondary-background-color: #eef1f4;
      --divider-color: #d7dce1;
    }
    body { margin: 0; padding: 20px; }
    main { max-width: 1000px; margin: auto; }
    h1 { font-size: 20px; margin: 0 0 20px; }
    #cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; gap: 12px; }
    #editor-view { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 24px; align-items: start; }
    #editor-view > * { min-width: 0; }
    @media (max-width: 700px) {
      #editor-view { grid-template-columns: minmax(0, 1fr); }
    }
    shopping-list-card { display: block; min-width: 0; }
    shopping-list-card.wide { grid-column: span 2; }
    ha-card { display: block; }
    shopping-list-catalog { display: block; }
    ha-icon { display: inline-flex; align-items: center; justify-content: center; font-size: var(--mdc-icon-size, 24px); width: 24px; height: 24px; }
    ha-alert { display: block; font-size: 13px; line-height: 1.5; color: #9e2424; }
    ha-alert[alert-type="info"] { color: #365a6d; }
    @media (max-width: 600px) {
      body { padding: 12px; }
      #cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main><h1>Shopping</h1><div id="cards"></div></main>
  <script type="module">
    class TestIcon extends HTMLElement {
      static get observedAttributes() { return ['icon']; }
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"><style>:host{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px}span{font-size:var(--mdc-icon-size,24px)}</style><span class="mdi"></span>';
      }
      attributeChangedCallback() {
        const name = this.getAttribute('icon')?.replace('mdi:', 'mdi-');
        this.shadowRoot.querySelector('span').className = `mdi ${name || ''}`;
      }
    }
    customElements.define('ha-icon', TestIcon);
    const editorMode = new URLSearchParams(location.search).has('editor');
    const catalogMode = new URLSearchParams(location.search).has('catalog');
    customElements.define('ha-card', class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = '<style>:host{display:block}</style><slot></slot>';
      }
    });
    customElements.define('ha-alert', class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = '<style>:host{display:block;font-size:13px;line-height:1.5;color:#9e2424}:host([alert-type="info"]){color:#365a6d}</style><slot></slot>';
      }
    });
    if (editorMode) {
      class TestField extends HTMLElement {
        static get observedAttributes() { return ['label']; }
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.innerHTML = '<style>:host{display:block;min-width:0}label{display:grid;gap:6px;font-size:12px;color:#656970}input,select{box-sizing:border-box;width:100%;height:40px;min-width:0;border:1px solid #adb4bd;border-radius:4px;padding:8px;background:#fff;color:#212121;font:inherit;font-size:14px}input:focus-visible,select:focus-visible{outline:2px solid #0288d1}</style><label><span></span></label>';
          this._input = document.createElement(this.localName === 'ha-select' ? 'select' : 'input');
          this.shadowRoot.querySelector('label').append(this._input);
          this._input.addEventListener('input', event => {
            event.stopPropagation();
            this.dispatchEvent(new CustomEvent('value-changed', { detail: { value: this.value }, bubbles: true, composed: true }));
          });
          this._input.addEventListener('change', event => {
            event.stopPropagation();
            const type = this.localName === 'ha-select' ? 'selected' : 'change';
            this.dispatchEvent(new CustomEvent(type, { detail: { value: this.value }, bubbles: true, composed: true }));
          });
        }
        attributeChangedCallback() { this.shadowRoot.querySelector('span').textContent = this.getAttribute('label') || ''; }
        get value() { return this._input.value; }
        set value(value) { if (this._input.value !== String(value ?? '')) this._input.value = value ?? ''; }
        set options(options) {
          this._input.replaceChildren(...options.map(option => {
            const element = document.createElement('option');
            element.value = option.value;
            element.textContent = option.label;
            return element;
          }));
        }
      }
      for (const name of ['ha-input', 'ha-entity-picker', 'ha-icon-picker', 'ha-select']) {
        customElements.define(name, class extends TestField {});
      }
      customElements.define('ha-switch', class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.innerHTML = '<input type="checkbox" aria-label="Enabled">';
          this.shadowRoot.querySelector('input').addEventListener('change', () => this.dispatchEvent(new Event('change', { bubbles: true })));
        }
        get checked() { return this.shadowRoot.querySelector('input').checked; }
        set checked(value) { this.shadowRoot.querySelector('input').checked = value; }
      });
      customElements.define('ha-expansion-panel', class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.innerHTML = '<style>summary{padding:14px 16px;font-weight:500;cursor:pointer}</style><details><summary></summary><slot></slot></details>';
        }
        connectedCallback() {
          this.shadowRoot.querySelector('summary').textContent = this.getAttribute('header') || '';
          this.shadowRoot.querySelector('details').open = this.hasAttribute('expanded');
        }
      });
      customElements.define('ha-picture-upload', class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.innerHTML = '<style>button{display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid #adb4bd;border-radius:4px;background:white;padding:4px 10px;cursor:pointer;font:inherit;color:#212121}</style><button type="button"><ha-icon icon="mdi:upload"></ha-icon>Upload image</button>';
          this.shadowRoot.querySelector('button').addEventListener('click', () => {
            this.value = window.fixture.image;
            this.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
          });
        }
      });
    }
    await import('../shopping-list-card.js');
    const entries = [
      { uid: 'milk', summary: 'Milk (2)', status: 'needs_action' },
      { uid: 'apples', summary: 'Apple - Pink Lady', status: 'needs_action' },
    ];
    const listeners = new Set();
    const calls = [];
    let failNext = false;
    let releaseWrite = null;
    let pauseWrites = false;
    let moreInfo = 0;
    let nextUid = 1;
    const canvas = document.createElement('canvas');
    canvas.width = 80;
    canvas.height = 80;
    const drawing = canvas.getContext('2d');
    drawing.fillStyle = '#d9ebf3';
    drawing.fillRect(0, 0, 80, 80);
    drawing.fillStyle = '#4a7385';
    drawing.fillRect(25, 12, 30, 58);
    drawing.fillStyle = '#ffffff';
    drawing.font = 'bold 10px sans-serif';
    drawing.textAlign = 'center';
    drawing.fillText('MILK', 40, 44);
    const image = canvas.toDataURL('image/png');
    const push = () => { for (const callback of listeners) callback({ items: entries.map(entry => ({ ...entry })) }); };
    const hass = {
      connected: true,
      states: { 'todo.test': { state: '2' } },
      connection: {
        subscribeMessage(callback) {
          listeners.add(callback);
          queueMicrotask(() => callback({ items: entries.map(entry => ({ ...entry })) }));
          return Promise.resolve(() => listeners.delete(callback));
        },
      },
      callWS: async () => ({ items: entries.map(entry => ({ ...entry })) }),
      async callService(domain, service, data) {
        calls.push({ domain, service, data });
        if (pauseWrites) await new Promise(resolve => { releaseWrite = resolve; });
        if (failNext) { failNext = false; throw new Error('Test permission error'); }
        if (service === 'add_item') entries.push({ uid: `new-${nextUid++}`, summary: data.item, status: 'needs_action' });
        else {
          const index = entries.findIndex(entry => entry.uid === data.item || entry.summary === data.item);
          if (index === -1) throw new Error('Item no longer exists');
          if (service === 'remove_item') entries.splice(index, 1);
          else {
            if (data.rename !== undefined) entries[index].summary = data.rename;
            if (data.status !== undefined) entries[index].status = data.status;
          }
        }
        push();
      },
    };
    class TestTodoList extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = '<style>:host{display:block}*{box-sizing:border-box}form{display:flex;gap:8px;margin-bottom:12px}input[type=text]{min-width:0;flex:1;height:40px;padding:8px;border:1px solid #adb4bd;border-radius:4px;font:inherit}button{border:0;border-radius:4px;min-width:36px;background:transparent;color:inherit;cursor:pointer}label{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #d7dce1;font-size:14px}label span{overflow-wrap:anywhere}label input{width:18px;height:18px;flex-shrink:0}label:has(input:checked) span{text-decoration:line-through;color:#656970}</style><form><input type="text" aria-label="New list item" placeholder="Add item" required><button type="submit" aria-label="Add list item" title="Add item"><ha-icon icon="mdi:plus"></ha-icon></button></form><div class="items"></div>';
        this.shadowRoot.querySelector('form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = this.shadowRoot.querySelector('input[type=text]');
          if (!input.value.trim()) return;
          await this.hass.callService('todo', 'add_item', { entity_id: this._config.entity, item: input.value.trim() });
          input.value = '';
        });
      }
      setConfig(config) { this._config = config; }
      connectedCallback() {
        this._active = true;
        this.hass.connection.subscribeMessage(message => this._renderItems(message.items), {
          type: 'todo/item/subscribe', entity_id: this._config.entity,
        }).then(unsubscribe => {
          if (this._active) this._unsubscribe = unsubscribe;
          else unsubscribe();
        });
      }
      disconnectedCallback() { this._active = false; this._unsubscribe?.(); }
      _renderItems(items) {
        const container = this.shadowRoot.querySelector('.items');
        container.replaceChildren();
        for (const item of items) {
          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = item.status === 'completed';
          const title = document.createElement('span');
          title.textContent = item.summary;
          checkbox.addEventListener('change', () => this.hass.callService('todo', 'update_item', {
            entity_id: this._config.entity, item: item.uid,
            status: checkbox.checked ? 'completed' : 'needs_action',
          }));
          label.append(checkbox, title);
          container.append(label);
        }
      }
    }
    window.loadCardHelpers = async () => ({ createCardElement(config) {
      if (!customElements.get('hui-todo-list-card')) customElements.define('hui-todo-list-card', TestTodoList);
      const card = document.createElement('hui-todo-list-card');
      card.setConfig(config);
      return card;
    } });
    let catalogData;
    if (catalogMode || editorMode) {
      const response = await fetch('../examples/auto-generated-grid/shopping_items.json');
      catalogData = await response.json();
      const icons = {
        Fruits: 'mdi:food-apple-outline', Vegetables: 'mdi:carrot', Frozen: 'mdi:snowflake',
        'Dairy and Eggs': 'mdi:bottle-soda-outline', Meat: 'mdi:food-drumstick',
        'Condiments, Herbs & Spices': 'mdi:shaker-outline', Grains: 'mdi:barley', Snacks: 'mdi:cookie-outline',
      };
      for (const [category, products] of Object.entries(catalogData)) {
        for (const product of products) {
          product.off_icon = icons[category] || 'mdi:cart-outline';
          if (product.title === 'Milk') product.image = image;
        }
      }
      hass.states['sensor.catalog'] = { state: '1', attributes: catalogData };
    }
    const configurations = [
      { id: 'milk', title: 'Milk', enable_quantity: true, image },
      { id: 'bread', title: 'Bread', off_icon: 'mdi:bread-slice', hold_action: { action: 'none' } },
      { id: 'apple', title: 'Apple', types: ['Pink Lady', 'Granny Smith', 'Gala'], enable_quantity: true, hold_action: { action: 'more-info' } },
      { id: 'milk-vertical', title: 'Milk', layout: 'vertical', enable_quantity: true, image },
      { id: 'oats', title: 'Rolled oats', layout: 'vertical', off_icon: 'mdi:barley' },
      { id: 'apple-vertical', title: 'Apple', layout: 'vertical', types: ['Pink Lady', 'Granny Smith', 'Gala'], enable_quantity: true },
    ];
    for (const configuration of catalogMode || editorMode ? [] : configurations) {
      const card = document.createElement('shopping-list-card');
      card.dataset.fixtureCard = '';
      card.id = configuration.id;
      if (!configuration.layout) card.classList.add('wide');
      const { id, ...config } = configuration;
      card.setConfig({ type: 'custom:shopping-list-card', todo_list: 'todo.test', ...config });
      card.hass = hass;
      card.addEventListener('hass-more-info', () => { moreInfo++; });
      document.querySelector('#cards').append(card);
    }
    const editorChanges = [];
    const catalogConfig = {
      type: 'custom:shopping-list-card', mode: 'catalog', catalog_entity: 'sensor.catalog', todo_list: 'todo.test',
      title: 'Shopping', columns: 4,
    };
    if (editorMode) {
      document.querySelector('h1').textContent = 'Card settings';
      document.querySelector('#cards').remove();
      const view = document.createElement('div');
      view.id = 'editor-view';
      const editor = document.createElement('shopping-list-card-editor');
      const preview = document.createElement('shopping-list-card');
      preview.dataset.fixtureCard = '';
      preview.id = 'editor-preview';
      const config = catalogMode ? catalogConfig : {
        type: 'custom:shopping-list-card', title: 'Apple', todo_list: 'todo.test', enable_quantity: true,
        types: [{ name: 'Pink Lady', image, icon: 'mdi:food-apple' }, 'Granny Smith', { name: 'Gala', icon: 'mdi:food-apple-outline' }],
      };
      editor.setConfig(config);
      editor.hass = hass;
      preview.setConfig(config);
      preview.hass = hass;
      editor.addEventListener('config-changed', event => {
        const saved = structuredClone(event.detail.config);
        editorChanges.push(saved);
        editor.setConfig(saved);
        preview.setConfig(saved);
      });
      view.append(editor, preview);
      document.querySelector('main').append(view);
    } else if (catalogMode) {
      document.querySelector('h1').remove();
      const catalog = document.createElement('shopping-list-card');
      catalog.dataset.fixtureCard = '';
      catalog.id = 'catalog-preview';
      catalog.setConfig(catalogConfig);
      catalog.hass = hass;
      catalog.addEventListener('hass-more-info', () => { moreInfo++; });
      document.querySelector('#cards').replaceWith(catalog);
    }
    window.fixture = {
      calls,
      entries,
      image,
      editorChanges,
      catalogData,
      get moreInfo() { return moreInfo; },
      get subscriptions() { return listeners.size; },
      failNextWrite() { failNext = true; },
      pauseWrites() { pauseWrites = true; },
      resumeWrites() { pauseWrites = false; releaseWrite?.(); releaseWrite = null; },
      pushUnrelated() { push(); },
      updateCatalog(data) {
        catalogData = structuredClone(data);
        hass.states['sensor.catalog'] = { state: String(Date.now()), attributes: catalogData };
        for (const card of document.querySelectorAll('shopping-list-card[data-fixture-card]')) card.hass = { ...hass };
      },
      setCatalogAvailable(available) {
        hass.states['sensor.catalog'] = { state: available ? '1' : 'unavailable', attributes: catalogData };
        for (const card of document.querySelectorAll('shopping-list-card[data-fixture-card]')) card.hass = { ...hass };
      },
      setConnected(connected) {
        hass.connected = connected;
        for (const card of document.querySelectorAll('shopping-list-card[data-fixture-card]')) card.hass = { ...hass };
      },
      configureCatalog(options) {
        const card = document.querySelector('shopping-list-card[data-fixture-card]');
        card.setConfig({ ...card._config, ...options });
      },
    };
  </script>
</body>
</html>
